[package]
name = "lithidion-core"
description = "Lithidion's watch connection, storage, and services, without a user interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "background", "location", "settings"] }
async-channel = "2.5.0"
async-io = "2"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
gdk-pixbuf = "0.22"
gio = "0.22"
glib = "0.22"
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
icalendar = { version = "0.17", default-features = false, features = ["parser", "chrono-tz", "recurrence"] }
pebble-protocol = { path = "../pebble-protocol" }
pulseaudio = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
javascriptcore6 = "0.6"
md-5 = "0.10"
base64 = "0.22"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
transcribe-cpp = { version = "0.4", default-features = false }
oxideav-speex = "0.0.12"
sha2 = "0.10"

[features]
# Helpers for the window's tests.
test-support = []
